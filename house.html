<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>glTF Viewer</title>
  <script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; }
    model-viewer { width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <model-viewer
    src="./house.gltf"
    alt="Our House"
    camera-controls
    ar
    ar-modes="webxr scene-viewer quick-look"
    auto-rotate
    shadow-intensity="1">
  </model-viewer>
</body>
</html>
